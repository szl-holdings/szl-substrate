[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "szl-substrate"
version = "0.1.0"
description = "Installable shared substrate for a11oy + killinchu — eliminates 69-file source duplication. First modules: DSSE/ECDSA-P256-SHA256 signing (cosign-compatible, UNSIGNED-honest fallback), ECE/Brier calibration tracking (pure-Python), and governed reasoning-brain scaffolding. Λ = Conjecture 1 (advisory). SLSA L1 honest · L2 roadmap · Apache-2.0."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Lutar, Stephen P.", email = "stephenlutar2@gmail.com" },
]
keywords = ["dsse", "cosign", "calibration", "governed-ai", "receipts", "szl", "doctrine-v11"]
dependencies = [
    # Required by szl_dsse for real ECDSA-P256-SHA256 signing/verification.
    # When absent, szl_dsse degrades to an honest UNSIGNED marker — it never
    # fabricates a signature — but signing is a first-class feature here so we
    # declare it as a hard dependency of the package.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Runtime extras, named after the modules that need them. `import szl_substrate` needs
# only the core dependency above; tests/test_dependency_contract.py maps every
# third-party import to core or to one of these groups and fails on anything unmapped.
# Floors are the lowest versions installed and tested on 2026-10-28 (a11oy runtime pins,
# VM1); numpy 2.2.6 is the last numpy release that supports Python 3.10.
web = [
    # ASGI route modules (operator_shell_v4, szl_waqay, szl_yupay, ...). httpx backs
    # starlette.testclient and the szl_deepdive_gaps fleet roll-up.
    "fastapi>=0.143.2",
    "starlette>=1.7.0",
    "httpx>=0.28.1",
]
rag = [
    # a11oy_org_rag: GitHub/HF ingest (httpx) and the dense WAQAY backend (numpy).
    "httpx>=0.28.1",
    "numpy>=2.2.6",
]
khipu = [
    # szl_khipu_lmdb and szl_unay_routes (LMDB-backed khipu store).
    "lmdb>=2.3.0",
]
sigstore = [
    # szl_formulas.verify_dsse_real (Sigstore bundle verification).
    "sigstore>=4.5.1",
]
all = [
    "fastapi>=0.143.2",
    "starlette>=1.7.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "lmdb>=2.3.0",
    "sigstore>=4.5.1",
]

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-substrate"
Repository = "https://github.com/szl-holdings/szl-substrate"
Issues = "https://github.com/szl-holdings/szl-substrate/issues"
Changelog = "https://github.com/szl-holdings/szl-substrate/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/szl_substrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_substrate"] # wheel top-level import names; the release gate fails if the built wheel differs
