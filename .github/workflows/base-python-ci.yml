# Standard Python gate for the szl-holdings estate: ruff + pytest on the two
# supported interpreters. Installed by the szl-alignment engine (only into
# repos where Python is detected) from
# alignment/templates/workflows/base-python-ci.yml. Local deviation from that
# template: the toolchain, the core dependency and the dev extra install from
# the hash-locked requirements/ci/base.txt (OpenSSF Scorecard
# Pinned-Dependencies), the package installs with --no-deps, and the
# template's requirements*.txt probes are dropped because this repository has
# no such files. The web extra stays uninstalled on purpose, so this gate
# keeps proving that the suite runs without fastapi/starlette/httpx.
name: base-python-ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Org policy: every action is pinned to a full-length commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Regenerate with the command in requirements/ci/base.in.
      - name: Install toolchain (hash-locked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci/base.txt

      - name: Install the package (no dependency resolution)
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      # Blocking scope is the classes that indicate real breakage (syntax
      # errors, undefined names, unused imports). The full default ruleset runs
      # non-blocking so repos keep visibility without a forced flag day; repos
      # with their own ruff config in pyproject.toml already get stricter
      # behavior from their primary CI.
      - name: "Ruff (blocking: E9/F)"
        run: ruff check . --output-format github --select E9,F

      - name: Ruff (full ruleset, informational)
        run: ruff check . --statistics --exit-zero

      # The base gate owns tests/ only. Suites living elsewhere (scripts/,
      # tools/) are exercised by each repo's dedicated workflows with their
      # own dependency pins; collecting them here would fail on imports this
      # minimal install does not provide. Repos with no tests/ skip honestly.
      - name: Pytest (blocking)
        run: |
          if [ -d tests ]; then
            pytest -q tests
          else
            echo "::notice::No tests/ directory; base gate defers to repo-specific suites."
          fi
