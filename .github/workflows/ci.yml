name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Every distribution comes from the hash-locked file (core + dev + web
      # extras, plus the build backend); the package itself then installs
      # without resolving anything. Regenerate with the command in
      # requirements/ci/test.in.
      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci/test.txt

      - name: Install the package (no dependency resolution)
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Check installed requirements are consistent
        run: python -m pip check

      - name: Run pytest
        run: python -m pytest -q
